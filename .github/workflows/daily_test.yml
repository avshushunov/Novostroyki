name: Daily Selenium Test

on:
  schedule:
    # Запускать каждый день в 03:00 UTC (06:00 МСК)
    # Важно: GitHub Actions использует время UTC.
    - cron: '0 3 * * *'
  # Эта строчка позволит запустить тест вручную кнопкой в интерфейсе GitHub
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11' # Укажите вашу версию

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Install xvfb (виртуальный дисплей для обычного Chrome)
        # дом.рф блокирует headless-браузеры, поэтому Chrome запускается в обычном
        # режиме на виртуальном дисплее Xvfb
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq xvfb
          fi

      - name: Run tests
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" pytest tests/test_new_buildings.py -v

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: failure-artifacts
          path: |
            artifacts/
            failure_*.png
          if-no-files-found: ignore
